name: PR Slack Notifier

on:
  pull_request:
    types: [review_requested, reopened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-slack-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  notify-devs:
    # Upstream-only. This needs livekit's Slack secrets, which the Mediflo fork does
    # not have (and should not wire up), so on the fork the job would only ever fail
    # and add a red X to every PR. Guarded rather than deleted, to keep the file
    # mergeable when the fork syncs with upstream.
    if: github.repository == 'livekit/media-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: livekit/slack-notifier-action@main
        with:
          config_json: ${{ secrets.SLACK_NOTIFY_CONFIG_JSON }}
          slack_token: ${{ secrets.SLACK_PR_NOTIFIER_TOKEN }}
